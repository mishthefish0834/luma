<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luma - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-main: #f8fafc;
            --text-primary: #000000;
            --text-secondary: #7e8a96;
            --border-color: #e2e8f0;
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'DM Serif Display', serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding: 60px 50px;
        }

        .header { display: flex; flex-direction: column; margin-bottom: 40px; }
        .date { font-size: 13px; font-weight: 700; color: var(--text-secondary); letter-spacing: 1px; margin-bottom: 8px; }
        .greeting { font-family: var(--font-serif); font-size: 44px; font-weight: 400; margin-bottom: 4px; }
        .sub-greeting { font-size: 16px; color: var(--text-secondary); }

        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 40px; }
        .card { background-color: #ffffff; border: 1px solid var(--border-color); border-radius: 20px; }
        .metric-card { padding: 24px; display: flex; flex-direction: column; gap: 4px; }
        .card-title { font-size: 11px; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.5px; }
        .card-value { font-size: 52px; font-weight: 600; line-height: 1.1; letter-spacing: -1px; }
        .card-footer { font-size: 15px; color: var(--text-secondary); }

        .dashboard-split { display: grid; grid-template-columns: 1.7fr 1.1fr; gap: 40px; align-items: start; }
        
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .section-heading { font-size: 24px; font-weight: 700; }

        .add-task-btn {
            background: none; border: none; font-family: var(--font-sans);
            font-size: 16px; font-weight: 700; color: var(--text-primary);
            cursor: pointer; display: flex; align-items: center; gap: 6px;
        }

        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-item {
            background: #ffffff; border: 1px solid var(--border-color);
            padding: 18px 24px; border-radius: 20px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .task-name { font-size: 18px; font-weight: 700; color: #000; }
        .task-tags { display: flex; gap: 8px; }
        .tag {
            font-size: 11px; font-weight: 700; padding: 4px 10px;
            border-radius: 20px; text-transform: uppercase;
            background: #f1f5f9; color: #64748b;
        }
        .tag-open { background: #fee2e2; color: #ef4444; }
        .tag-in-progress { background: #fef3c7; color: #d97706; }
        .tag-done { background: #dcfce7; color: #16a34a; }

        .tasks-empty-state {
            border: 2px dashed var(--border-color); border-radius: 24px;
            padding: 60px 20px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
        }
        .empty-text { color: var(--text-secondary); font-size: 16px; }

        .quick-actions-list { display: flex; flex-direction: column; gap: 12px; }
        .action-card { display: flex; align-items: center; padding: 16px 20px; gap: 18px; cursor: pointer; }
        .action-icon { font-size: 24px; color: var(--text-secondary); width: 32px; }
        .action-title { font-size: 16px; font-weight: 700; }
        .action-subtitle { font-size: 13px; color: var(--text-secondary); }

        @media (max-width: 1024px) {
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
            .dashboard-split { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="header">
        <span class="date">TODAY</span>
        <h2 class="greeting">good afternoon!</h2>
        <p class="sub-greeting">here's your quiet overview.</p>
    </header>

    <section class="metrics-grid">
        <div class="card metric-card">
            <span class="card-title">COMPLETED</span>
            <span class="card-value" id="completed-count">0</span>
            <span class="card-footer">tasks today</span>
        </div>
        <div class="card metric-card">
            <span class="card-title">FOCUS TIME</span>
            <span class="card-value" id="focus-time">0m</span>
            <span class="card-footer" id="focus-sessions-text">0 sessions completed</span>
        </div>
        <div class="card metric-card">
            <span class="card-title">REFLECTIONS</span>
            <span class="card-value">0</span>
            <span class="card-footer">entries</span>
        </div>
        <div class="card metric-card">
            <span class="card-title">MOOD</span>
            <span class="card-value">--</span>
            <span class="card-footer">no entries yet</span>
        </div>
    </section>

    <div class="dashboard-split">
        <section class="tasks-section">
            <div class="section-header">
                <h3 class="section-heading">today's tasks</h3>
                <button class="add-task-btn" onclick="openTasksWithModal()">
                    <i class="fa-solid fa-plus"></i> add a task
                </button>
            </div>
            
            <div id="tasks-container"></div>
        </section>

        <section class="quick-start-section">
            <h3 class="section-heading" style="margin-bottom: 16px;">quick start</h3>
            <div class="quick-actions-list">
                <div class="card action-card">
                    <div class="action-icon"><i class="fa-regular fa-clock"></i></div>
                    <div>
                        <div class="action-title">start focusing</div>
                        <div class="action-subtitle">25 min pomodoro</div>
                    </div>
                </div>
                <div class="card action-card">
                    <div class="action-icon"><i class="fa-regular fa-bookmark"></i></div>
                    <div>
                        <div class="action-title">write a reflection</div>
                        <div class="action-subtitle">capture your thoughts</div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        function openTasksWithModal() {
            if (window.parent && window.parent.iframeChange) {
                window.parent.iframeChange('tasks', true);
            }
        }

        function renderDashboard() {
            let lumaData = JSON.parse(localStorage.getItem("luma_data")) || {
                focus: { sessions: 0, minutes: 0 },
                tasks: []
            };

            document.querySelector("#focus-time").innerHTML = lumaData.focus.minutes + "m";
            document.querySelector("#focus-sessions-text").innerHTML = lumaData.focus.sessions + " sessions completed";

            let tasks = lumaData.tasks || [];
            let completedTasks = tasks.filter(t => t.status === "done").length;
            document.querySelector("#completed-count").innerHTML = completedTasks;

            let container = document.querySelector("#tasks-container");

            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="tasks-empty-state">
                        <p class="empty-text">nothing on the plate today</p>
                        <button class="add-task-btn" onclick="openTasksWithModal()">
                            <i class="fa-solid fa-plus"></i> add a task
                        </button>
                    </div>
                `;
            } else {
                let html = '<div class="task-list">';
                for (let i = 0; i < tasks.length; i++) {
                    let task = tasks[i];
                    let statusClass = "tag-open";
                    if (task.status === "in progress") statusClass = "tag-in-progress";
                    if (task.status === "done") statusClass = "tag-done";

                    html += `
                        <div class="task-item">
                            <span class="task-name">${task.name}</span>
                            <div class="task-tags">
                                <span class="tag ${statusClass}">${task.status}</span>
                                <span class="tag">${task.priority}</span>
                                ${task.category ? `<span class="tag">${task.category}</span>` : ''}
                            </div>
                        </div>
                    `;
                }
                html += '</div>';
                container.innerHTML = html;
            }
        }

        renderDashboard();
    </script>
</body>
</html>
