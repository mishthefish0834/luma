<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luma - Create Productivity</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --bg-sidebar: #ebf3f9 !important;
        --bg-main: #f8fafc;
        --text-primary: #000000;
        --text-secondary: #7e8a96;
        --text-muted: #a0aec0;
        --border-color: #e2e8f0;
        --font-sans: 'Inter', sans-serif;
        --font-serif: 'DM Serif Display', serif;
        --timer-icon-color: #a4c2f4;
    }

    body {
        font-family: var(--font-sans);
        background-color: var(--bg-main);
        color: var(--text-primary);
        min-height: 100vh;
    }


    .app-container {
        display: flex;
        min-height: 100vh;
    }

    .sidebar {
        width: 260px;
        background-color: var(--bg-sidebar);
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        gap: 48px;
        border-right: 1px solid var(--border-color);
        position: fixed;
        height: 100vh;
    }

    .workspace {
        flex: 1;
        margin-left: 260px;
        display: flex;
        flex-direction: column;
    }

    .main-content {
        /* display: none;  */
        padding: 60px 50px;
        flex-direction: column;
        gap: 40px;
        max-width: 1200px;
        width: 100%;
        overflow: hidden;
    }

    .main-content.active-page {
        display: flex;
    }

    .brand {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .logo {
        font-family: var(--font-serif);
        font-size: 36px;
        font-weight: 400;
        letter-spacing: -0.5px;
    }

    .tagline {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-secondary);
        letter-spacing: 1px;
    }

    .nav-menu {
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 16px;
        text-decoration: none;
        color: var(--text-secondary);
        font-size: 18px;
        font-weight: 500;
        transition: color 0.2s ease;
    }

    .nav-item i {
        font-size: 20px;
        width: 24px;
        text-align: center;
    }

    .nav-item:hover,
    .nav-item.active {
        color: var(--text-primary);
    }

    .header {
        display: flex;
        flex-direction: column;
    }

    .date {
        font-size: 13px;
        font-weight: 700;
        color: var(--text-secondary);
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    .greeting {
        font-family: var(--font-serif);
        font-size: 44px;
        font-weight: 400;
        margin-bottom: 4px;
    }

    .sub-greeting {
        font-size: 16px;
        color: var(--text-secondary);
    }

    .card {
        background-color: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: 20px;
    }

    .metrics-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
    }

    .metric-card {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .card-title {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-secondary);
        letter-spacing: 0.5px;
    }

    .card-value {
        font-size: 52px;
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -1px;
    }

    .card-footer {
        font-size: 15px;
        color: var(--text-secondary);
    }

    .dashboard-split {
        display: grid;
        grid-template-columns: 1.7fr 1.1fr;
        gap: 40px;
        align-items: start;
    }

    .section-heading {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 16px;
    }

    .tasks-empty-state {
        border: 2px dashed var(--border-color);
        border-radius: 24px;
        padding: 60px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }

    .empty-text {
        color: var(--text-secondary);
        font-size: 16px;
    }

    .add-task-btn {
        background: none;
        border: none;
        font-family: var(--font-sans);
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .quick-actions-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .action-card {
        display: flex;
        align-items: center;
        padding: 16px 20px;
        gap: 18px;
        cursor: pointer;
        transition: transform 0.2s ease;
    }

    .action-card:hover {
        transform: translateY(-1px);
    }

    .action-icon {
        font-size: 24px;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        width: 32px;
    }

    .action-details {
        display: flex;
        flex-direction: column;
    }

    .action-title {
        font-size: 16px;
        font-weight: 700;
    }

    .action-subtitle {
        font-size: 13px;
        color: var(--text-secondary);
    }

    .focus-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
        width: 100%;
        margin-top: 10px;
    }

    .timer-modes {
        display: flex;
        background-color: #e2e8f0;
        padding: 6px;
        border-radius: 30px;
        gap: 4px;
    }

    .mode-btn {
        background: none;
        border: none;
        padding: 10px 24px;
        font-family: var(--font-sans);
        font-size: 16px;
        font-weight: 600;
        color: #4a5568;
        border-radius: 24px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .mode-btn.active {
        background-color: #4a5568;
        color: #ffffff;
    }

    .timer-circle {
        width: 340px;
        height: 340px;
        border: 2px solid var(--border-color);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
    }

    .timer-inner-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .timer-icon {
        font-size: 42px;
        color: var(--timer-icon-color);
        margin-bottom: 8px;
    }

    .timer-countdown {
        font-size: 72px;
        font-weight: 500;
        letter-spacing: -1px;
        line-height: 1.1;
    }

    .timer-status-text {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: var(--text-secondary);
        margin-top: 8px;
    }

    .timer-controls {
        display: flex;
        align-items: center;
        gap: 24px;
    }

    .control-btn {
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.1s ease;
    }

    .control-btn:active {
        transform: scale(0.95);
    }

    .reset-btn {
        background-color: #ffffff;
        border: 1px solid var(--border-color);
        width: 54px;
        height: 54px;
        border-radius: 50%;
        font-size: 18px;
        color: var(--text-primary);
    }

    .play-btn {
        background-color: #4a5568;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        font-size: 20px;
        color: #ffffff;
        padding-left: 4px;
    }

    .focus-stats {
        font-size: 16px;
        color: var(--text-secondary);
    }

    .focus-stats strong {
        color: var(--text-primary);
    }

    @media (max-width: 1024px) {
        .metrics-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .dashboard-split {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 768px) {
        .sidebar {
            width: 100%;
            height: auto;
            position: relative;
            padding: 24px;
        }

        .workspace {
            margin-left: 0;
        }

        .nav-menu {
            flex-direction: row;
            flex-wrap: wrap;
        }

        .main-content {
            padding: 30px 20px;
        }

        .metrics-grid {
            grid-template-columns: 1fr;
        }

        .timer-circle {
            width: 280px;
            height: 280px;
        }

        .timer-countdown {
            font-size: 60px;
        }
    }
</style>

<script>
    let timerDisplay = document.querySelector("#timer");
    let timerStatus = document.querySelector("#timer-status");
    let playBtn = document.querySelector(".play-btn");
    let playIcon = document.querySelector(".play-btn i");
    let resetBtn = document.querySelector(".reset-btn");
    let modeButtons = document.querySelectorAll(".mode-btn");
    let focusStatsText = document.querySelector(".focus-stats strong");

    let timerInterval = null;
    let timeLeft = 25 * 60; 
    let currentModeTime = 25 * 60;

    function loadFocusStats() {
        let lumaData = JSON.parse(localStorage.getItem("luma_data")) || { focus: { sessions: 0, minutes: 0 } };
        if (focusStatsText) {
            focusStatsText.innerHTML = lumaData.focus.sessions;
        }
    }

    function updateDisplay() {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        
        if (minutes < 10) minutes = "0" + minutes;
        if (seconds < 10) seconds = "0" + seconds;

        timerDisplay.innerHTML = minutes + ":" + seconds;
    }

    function startTimer() {
        if (timerInterval === null) {
            playIcon.className = "fa-solid fa-pause";
            
            timerInterval = setInterval(function() {
                timeLeft = timeLeft - 1;
                updateDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    playIcon.className = "fa-solid fa-play";
                    
                    let lumaData = JSON.parse(localStorage.getItem("luma_data")) || { focus: { sessions: 0, minutes: 0 } };
                    
                    if (timerStatus.innerHTML === "FOCUS") {
                        lumaData.focus.sessions += 1;
                        lumaData.focus.minutes += 25; 
                    }
                    
                    localStorage.setItem("luma_data", JSON.stringify(lumaData));
                    
                    loadFocusStats(); 
                    window.alert("Session finished!");
                }
            }, 1000);
        }
    }

    function stopTimer() {
        if (timerInterval !== null) {
            clearInterval(timerInterval);
            timerInterval = null;
            playIcon.className = "fa-solid fa-play";
        }
    }

    playBtn.addEventListener("click", function() {
        if (timerInterval !== null) {
            stopTimer();
        } else {
            startTimer();
        }
    });

    resetBtn.addEventListener("click", function() {
        stopTimer();
        timeLeft = currentModeTime;
        updateDisplay();
    });

    for (let i = 0; i < modeButtons.length; i++) {
        modeButtons[i].addEventListener("click", function(event) {
            for (let j = 0; j < modeButtons.length; j++) {
                modeButtons[j].classList.remove("active");
            }
            event.target.classList.add("active");

            let mode = event.target.innerHTML.trim();
            if (mode === "focus") {
                currentModeTime = 25 * 60;
                timerStatus.innerHTML = "FOCUS";
            } else if (mode === "short break") {
                currentModeTime = 5 * 60;
                timerStatus.innerHTML = "SHORT BREAK";
            } else if (mode === "long break") {
                currentModeTime = 15 * 60;
                timerStatus.innerHTML = "LONG BREAK";
            }

            stopTimer();
            timeLeft = currentModeTime;
            updateDisplay();
        });
    }

    function checkAutoStart() {
        let autoStart = localStorage.getItem("luma_auto_start_focus");
        if (autoStart === "true") {
            localStorage.removeItem("luma_auto_start_focus");
            stopTimer();
            currentModeTime = 25 * 60;
            timeLeft = 25 * 60;
            timerStatus.innerHTML = "FOCUS";
            
            for (let j = 0; j < modeButtons.length; j++) {
                if (modeButtons[j].innerHTML.trim() === "focus") {
                    modeButtons[j].classList.add("active");
                } else {
                    modeButtons[j].classList.remove("active");
                }
            }
            
            updateDisplay();
            startTimer();
        }
    }

    updateDisplay();
    loadFocusStats();
    checkAutoStart();
</script>
