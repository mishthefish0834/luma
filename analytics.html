<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luma - Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-main: #f8fafc;
            --text-primary: #000000;
            --text-secondary: #7e8a96;
            --border-color: #e2e8f0;
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'DM Serif Display', serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 60px 50px;
        }

        .page-header {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 40px;
            max-width: 1200px;
            width: 100%;
        }

        .page-title {
            font-family: var(--font-serif);
            font-size: 44px;
            font-weight: 400;
            line-height: 1;
        }

        .sub-heading {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            max-width: 1200px;
            width: 100%;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
        }

        .metric-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .card-value {
            font-size: 52px;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .card-footer {
            font-size: 15px;
            color: var(--text-secondary);
        }

        @media (max-width: 1024px) {
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 30px 20px;
            }
            .metrics-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="page-header">
        <h1 class="page-title">analytics</h1>
        <p class="sub-heading">patterns in your productivity</p>
    </header>

    <main class="metrics-grid">
        
        <div class="card metric-card">
            <span class="card-title">Tasks Done</span>
            <span class="card-value">0</span>
            <span class="card-footer">of 0 total</span>
        </div>
        
        <div class="card metric-card">
            <span class="card-title">Focus Hours</span>
            <span class="card-value">0h</span>
            <span class="card-footer">total tracked</span>
        </div>
        
        <div class="card metric-card">
            <span class="card-title">Completion</span>
            <span class="card-value">0%</span>
            <span class="card-footer">task rate</span>
        </div>
        
        <div class="card metric-card">
            <span class="card-title">Reflections</span>
            <span class="card-value">0</span>
            <span class="card-footer">total entries</span>
        </div>

    </main>

</body>
</html>
