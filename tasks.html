<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luma - Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-main: #f8fafc;
            --text-primary: #000000;
            --text-secondary: #7e8a96;
            --border-color: #e2e8f0;
            --btn-accent: #e1ecf7;
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'DM Serif Display', serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 60px 50px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
            max-width: 1200px;
            width: 100%;
        }

        .header-title-area {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .page-title {
            font-family: var(--font-serif);
            font-size: 44px;
            font-weight: 400;
            line-height: 1;
        }

        .task-stats-summary {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .new-task-btn {
            background-color: var(--btn-accent);
            color: #2c3e50;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-family: var(--font-sans);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filters-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        .filter-select-wrapper {
            position: relative;
        }

        .filter-select {
            appearance: none;
            -webkit-appearance: none;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px 36px 10px 16px;
            border-radius: 10px;
            font-family: var(--font-sans);
            font-size: 15px;
            color: #333333;
            cursor: pointer;
            min-width: 140px;
        }

        .filter-select-wrapper::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .tasks-container {
            max-width: 1200px;
            width: 100%;
        }

        .empty-state-card {
            border: 2px dashed var(--border-color);
            border-radius: 24px;
            padding: 100px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .empty-state-text {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .task-item {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 18px 24px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .task-name {
            font-size: 18px;
            font-weight: 600;
        }

        .task-tags {
            display: flex;
            gap: 8px;
        }

        .tag {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            background: #f1f5f9;
            color: #64748b;
        }

        .tag-open {
            background: #fee2e2;
            color: #f15a5a;
        }

        .tag-in-progress {
            background: #fef3c7;
            color: #d97706;
        }

        .tag-done {
            background: #dcfce7;
            color: #16a34a;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-box {
            background: #ffffff;
            padding: 32px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .modal-title {
            font-family: var(--font-serif);
            font-size: 28px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .form-input,
        .modal-select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: var(--font-sans);
            font-size: 15px;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }

        .modal-btn {
            padding: 12px 20px;
            border-radius: 30px;
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background: #f1f5f9;
            color: #64748b;
        }

        .btn-submit {
            background: #4a5568;
            color: #ffffff;
        }

        @media (max-width: 768px) {
            body {
                padding: 30px 20px;
            }

            .page-header {
                flex-direction: column;
                gap: 20px;
            }

            .filters-toolbar {
                flex-wrap: wrap;
            }

            .filter-select-wrapper {
                flex: 1;
                min-width: 120px;
            }
        }
    </style>
</head>

<body>

    <header class="page-header">
        <div class="header-title-area">
            <h1 class="page-title">tasks</h1>
            <p class="task-stats-summary" id="stats-text">0 open &bull; 0 in progress &bull; 0 done</p>
        </div>
        <button class="new-task-btn" id="open-modal-btn">
            <i class="fa-solid fa-plus"></i> new task
        </button>
    </header>

    <section class="filters-toolbar">
        <div class="filter-select-wrapper">
            <select class="filter-select">
                <option>all status</option>
                <option>open</option>
                <option>in progress</option>
                <option>done</option>
            </select>
        </div>
        <div class="filter-select-wrapper">
            <select class="filter-select">
                <option>all priority</option>
                <option>high</option>
                <option>medium</option>
                <option>low</option>
            </select>
        </div>
        <div class="filter-select-wrapper">
            <select class="filter-select">
                <option>all categories</option>
                <option>work</option>
                <option>personal</option>
                <option>study</option>
            </select>
        </div>
    </section>

    <main class="tasks-container">
        <div class="empty-state-card" id="empty-state">
            <p class="empty-state-text">no tasks match your filters</p>
        </div>

        <div class="task-list" id="task-list" style="display: none;"></div>
    </main>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-box">
            <h2 class="modal-title">add task.</h2>

            <div class="form-group">
                <label>task name</label>
                <input type="text" id="input-task-name" class="form-input" placeholder="what are you working on?">
            </div>

            <div class="form-group">
                <label>status</label>
                <select id="select-status" class="modal-select">
                    <option value="open">open</option>
                    <option value="in progress">in progress</option>
                    <option value="done">done</option>
                </select>
            </div>

            <div class="form-group">
                <label>priority</label>
                <select id="select-priority" class="modal-select">
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                </select>
            </div>

            <div class="form-group">
                <label>category</label>
                <select id="select-category" class="modal-select">
                    <option value="work">work</option>
                    <option value="personal">personal</option>
                    <option value="study">study</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="modal-btn btn-cancel" id="btn-close-modal">cancel</button>
                <button class="modal-btn btn-submit" id="btn-save-task">add task</button>
            </div>
        </div>
    </div>
    <script>
        let modalOverlay = document.querySelector("#modal-overlay");
        let openModalBtn = document.querySelector("#open-modal-btn");
        let closeModalBtn = document.querySelector("#btn-close-modal");
        let saveTaskBtn = document.querySelector("#btn-save-task");

        let taskListContainer = document.querySelector("#task-list");
        let emptyStateCard = document.querySelector("#empty-state");
        let statsText = document.querySelector("#stats-text");

        // Filter dropdown elements
        let statusFilter = document.querySelectorAll(".filter-select")[0];
        let priorityFilter = document.querySelectorAll(".filter-select")[1];
        let categoryFilter = document.querySelectorAll(".filter-select")[2];

        let editingIndex = -1;

        function getLumaData(){
            let data = JSON.parse(localStorage.getItem("luma_data")) || {};
            if (!data.tasks) data.tasks = [];
            if (!data.stats) data.stats = { totalCompletedTasks: 0 };
            return data;
        }

        openModalBtn.addEventListener("click", function () {
            editingIndex = -1;
            document.querySelector(".modal-title").innerHTML = "add task.";
            saveTaskBtn.innerHTML = "add task";
            clearModalInputs();
            modalOverlay.style.display = "flex";
        });

        closeModalBtn.addEventListener("click", function () {
            modalOverlay.style.display = "none";
            clearModalInputs();
        });

        function clearModalInputs() {
            document.querySelector("#input-task-name").value = "";
            document.querySelector("#select-status").value = "open";
            document.querySelector("#select-priority").value = "low";
            document.querySelector("#select-category").value = "work";
        }

        function renderTasks() {
            let lumaData = getLumaData();
            let tasks = lumaData.tasks;

            // Update top bar stats totals
            let openCount = tasks.filter(t => t.status === "open").length;
            let inProgressCount = tasks.filter(t => t.status === "in progress").length;
            let doneCount = tasks.filter(t => t.status === "done").length;
            statsText.innerHTML = `${openCount} open &bull; ${inProgressCount} in progress &bull; ${doneCount} done`;

            if (tasks.length === 0) {
                emptyStateCard.style.display = "flex";
                taskListContainer.style.display = "none";
                return;
            }

            // Get current values from filter selects
            let selectedStatus = statusFilter.value.toLowerCase();
            let selectedPriority = priorityFilter.value.toLowerCase();
            let selectedCategory = categoryFilter.value.toLowerCase();

            // Filter tasks based on selections
            let filteredTasks = tasks.filter(task => {
                let matchesStatus = (selectedStatus === "all status" || task.status.toLowerCase() === selectedStatus);
                let matchesPriority = (selectedPriority === "all priority" || task.priority.toLowerCase() === selectedPriority);
                let matchesCategory = (selectedCategory === "all categories" || (task.category && task.category.toLowerCase() === selectedCategory));
                return matchesStatus && matchesPriority && matchesCategory;
            });

            if (filteredTasks.length === 0) {
                emptyStateCard.style.display = "flex";
                emptyStateCard.querySelector(".empty-state-text").innerHTML = "no tasks match your filters";
                taskListContainer.style.display = "none";
                return;
            }

            emptyStateCard.style.display = "none";
            taskListContainer.style.display = "flex";
            taskListContainer.innerHTML = "";

            for (let i = 0; i < tasks.length; i++) {
                let currentTask = tasks[i];

                // Check if this specific item passes the filter criteria
                let matchesStatus = (selectedStatus === "all status" || currentTask.status.toLowerCase() === selectedStatus);
                let matchesPriority = (selectedPriority === "all priority" || currentTask.priority.toLowerCase() === selectedPriority);
                let matchesCategory = (selectedCategory === "all categories" || (currentTask.category && currentTask.category.toLowerCase() === selectedCategory));

                if (!matchesStatus || !matchesPriority || !matchesCategory) {
                    continue; // Skip rendering if it doesn't match filter
                }

                let statusClass = "tag-open";
                if (currentTask.status === "in progress") {
                    statusClass = "tag-in-progress";
                } else if (currentTask.status === "done") {
                    statusClass = "tag-done";
                }

                let itemHTML = `
                    <div class="task-item">
                        <div class="task-info">
                            <span class="task-name">${currentTask.name}</span>
                            <div class="task-tags">
                                <span class="tag ${statusClass}">${currentTask.status}</span>
                                <span class="tag">${currentTask.priority}</span>
                                <span class="tag">${currentTask.category || 'work'}</span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <button onclick="openEditModal(${i})" style="background:none; border:none; color:#7e8a96; cursor:pointer; font-size:15px;">
                                <i class="fa-regular fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteTask(${i})" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:15px;">
                                <i class="fa-regular fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `;

                taskListContainer.innerHTML += itemHTML;
            }
        }

        // Attach event listeners to filters to re-render instantly on change
        statusFilter.addEventListener("change", renderTasks);
        priorityFilter.addEventListener("change", renderTasks);
        categoryFilter.addEventListener("change", renderTasks);

        saveTaskBtn.addEventListener("click", function () {
            let nameInput = document.querySelector("#input-task-name").value.trim();
            let statusInput = document.querySelector("#select-status").value;
            let priorityInput = document.querySelector("#select-priority").value;
            let categoryInput = document.querySelector("#select-category").value;

            if (nameInput === "") {
                alert("Please type out a name for your task!");
                return;
            }

            let lumaData = getLumaData();

            if (statusInput === "done"){
                let isNewlyDone = (editingIndex === -1) || (lumaData.tasks[editingIndex] && lumaData.tasks[editingIndex].status !== "done");
                if (isNewlyDone) {
                    lumaData.stats.totalCompletedTasks = (lumaData.stats.totalCompletedTasks || 0) + 1;
                }
            }

            let newTaskObject = {
                name: nameInput,
                status: statusInput,
                priority: priorityInput,
                category: categoryInput
            };

            if (editingIndex >= 0) {
                lumaData.tasks[editingIndex] = newTaskObject;
            } else {
                lumaData.tasks.push(newTaskObject);
            }

            localStorage.setItem("luma_data", JSON.stringify(lumaData));
            renderTasks();

            modalOverlay.style.display = "none";
            clearModalInputs();
        });

        window.openEditModal = function(index) {
            editingIndex = index;
            let lumaData = getLumaData();
            let task = lumaData.tasks[index];

            document.querySelector("#input-task-name").value = task.name;
            document.querySelector("#select-status").value = task.status;
            document.querySelector("#select-priority").value = task.priority;
            document.querySelector("#select-category").value = task.category || "work";

            document.querySelector(".modal-title").innerHTML = "edit task.";
            saveTaskBtn.innerHTML = "save changes";
            modalOverlay.style.display = "flex";
        };

        window.deleteTask = function(index) {
            if(confirm("delete this task?")) {
                let lumaData = getLumaData();
                lumaData.tasks.splice(index, 1);
                localStorage.setItem("luma_data", JSON.stringify(lumaData));
                renderTasks();
            }
        };

        window.triggerNewTaskModal = function () {
            if (modalOverlay) {
                modalOverlay.style.display = "flex";
            }
        };

        if (window.location.search.includes("openModal=true")) {
            if (modalOverlay) {
                modalOverlay.style.display = "flex";
            }
        }

        renderTasks();
    </script>
</body>

</html>
